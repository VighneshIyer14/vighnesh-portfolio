# Pages CMS — edit this site at https://app.pagescms.org (log in with GitHub).
# Every save commits to GitHub; GitHub rebuilds and the site updates in ~1 minute.
# Docs: https://pagescms.org/docs

media:
  input: public/uploads
  output: /uploads

content:
  # ---------------------------------------------------------------- Projects (folder in the sidebar)
  - name: projects-group
    label: Projects
    type: group
    items:
      - name: projects
        label: All projects
        type: collection
        path: src/content/projects
        format: yaml-frontmatter
        filename: "{primary}.md"
        view:
          fields: [title, discipline, order, featured, draft]
          primary: title
          sort: [order, title]
          default:
            sort: order
            order: asc
        fields:
          - { name: title, label: Title, type: string, required: true }
          - name: summary
            label: Summary (one sentence, shown on the card)
            type: text
            required: true
          - name: discipline
            label: Discipline (drives the Portfolio filter)
            type: select
            required: true
            default: UI/UX Design
            options:
              values: [UI/UX Design, 3D Modeling, Graphic Design]
          - { name: category, label: "Category (e.g. Fintech, Mobile app, Vehicle, Prop)", type: string, required: true }
          - { name: year, label: Year, type: string }
          - { name: role, label: Your role, type: string }
          - { name: tools, label: Tools, type: string, list: true }
          - { name: tags, label: Tags (first 3 shown on the card), type: string, list: true }
          - { name: cover, label: "Cover image (16:10, e.g. 1600×1000)", type: image, required: true }
          - name: gallery
            label: Gallery
            type: object
            list:
              collapsible:
                summary: "{index}. {caption}"
            fields:
              - { name: image, label: Image, type: image }
              - { name: caption, label: Caption, type: string }
          - { name: link, label: Live site / prototype link, type: string }
          - { name: featured, label: Featured (big glowing card on Home), type: boolean, default: false }
          - { name: order, label: "Order (backup only — use Projects → Reorder projects to drag)", type: number, default: 20 }
          - { name: draft, label: Draft (hide from the site), type: boolean, default: false }
          - name: content
            label: Case study builder
            description: "Click + Add to insert a block: Heading, Text, Image, Two images, Gallery, Quote, Process steps, Results, Callout, Video or Divider. Drag blocks to reorder; click a block to open it."
            type: block
            list:
              collapsible:
                collapsed: true
                summary: "{index}. {type}"
            blockKey: type
            blocks:
              - name: heading
                label: Heading (numbered section, e.g. Context / Problem / Process / Outcome)
                fields:
                  - { name: text, label: Heading, type: string, required: true }
              - name: text
                label: Text (paragraphs, lists, bold, links — images allowed too)
                fields:
                  - { name: body, label: Text, type: rich-text }
              - name: image
                label: Image with caption
                fields:
                  - { name: image, label: Image, type: image, required: true }
                  - { name: caption, label: Caption, type: string }
                  - { name: alt, label: "Alt text (describe the image for screen readers)", type: string }
                  - name: size
                    label: Size
                    type: select
                    default: Full width
                    options:
                      values: [Full width, Content width]
              - name: image-pair
                label: Two images side by side
                fields:
                  - { name: left, label: Left image, type: image }
                  - { name: leftCaption, label: Left caption, type: string }
                  - { name: right, label: Right image, type: image }
                  - { name: rightCaption, label: Right caption, type: string }
              - name: gallery
                label: Gallery (grid of images)
                fields:
                  - name: columns
                    label: Columns
                    type: select
                    default: "3"
                    options:
                      values: ["2", "3"]
                  - name: images
                    label: Images
                    type: object
                    list: true
                    fields:
                      - { name: image, label: Image, type: image }
                      - { name: caption, label: Caption, type: string }
              - name: quote
                label: Quote (user feedback, insight)
                fields:
                  - { name: quote, label: Quote, type: text, required: true }
                  - { name: author, label: "Who said it (e.g. Usability test participant)", type: string }
              - name: results
                label: Results / numbers
                fields:
                  - { name: title, label: "Title (e.g. Outcome)", type: string }
                  - name: items
                    label: Numbers
                    type: object
                    list: true
                    fields:
                      - { name: value, label: "Value (e.g. 3×, 40%)", type: string }
                      - { name: label, label: "Label (e.g. faster checkout)", type: string }
              - name: steps
                label: Process steps (numbered row, e.g. Sketches → Wireframes → Mock-ups → Final)
                fields:
                  - { name: title, label: "Title (e.g. How I worked)", type: string }
                  - name: items
                    label: Steps (2–4 works best)
                    type: object
                    list:
                      collapsible:
                        summary: "{index}. {title}"
                    fields:
                      - { name: title, label: "Step name (e.g. Sketches)", type: string }
                      - { name: text, label: "What you did and what came out of it", type: text }
              - name: callout
                label: Callout (glowing highlight box)
                fields:
                  - { name: label, label: "Label (e.g. Key insight)", type: string }
                  - { name: body, label: Text, type: rich-text }
              - name: video
                label: Video (YouTube, Vimeo or .mp4 link)
                fields:
                  - { name: url, label: Video link, type: string, required: true }
                  - { name: caption, label: Caption, type: string }
              - name: divider
                label: Divider line
                fields:
                  - { name: note, label: "(nothing to fill in)", type: string }
          - name: body
            label: Simple write-up (optional)
            description: "Write freely here. To drop a block from the builder above into your text, put its number on its own line, like [[1]] for the 1st block. Blocks you don't place appear after the text."
            type: rich-text

      - name: order
        label: Reorder projects (drag)
        type: file
        path: src/data/order.json
        format: json
        fields:
          - name: projects
            label: Projects — drag to reorder (top = first on the site)
            description: "Grab the handle on the left of a row and drag. New projects appear after this list until you add them here with + Add."
            type: reference
            list: true
            options:
              collection: projects
              search: title
              label: "{title}"


  # ---------------------------------------------------------------- Home & site-wide
  - name: site
    label: "Home & site-wide"
    type: file
    path: src/data/site.json
    format: json
    fields:
      - { name: name, label: Name, type: string }
      - { name: role, label: Role, type: string }
      - { name: location, label: Location, type: string }
      - { name: openToWork, label: Show “Open to work” badge, type: boolean }
      - { name: currentTitle, label: "Current job title (e.g. Product Designer) — shown when Open to work is OFF", type: string }
      - { name: currentCompany, label: "Current company — shown as “Currently working at … as …” when Open to work is OFF", type: string }
      - { name: currentCompanyUrl, label: "Current company website (optional)", type: string }
      - { name: headline, label: "Headline (wrap words in *stars* to make them neon)", type: string }
      - { name: heroImage, label: "Home hero image (replaces the drawn shapes beside the headline — leave empty for the shapes)", type: image }
      - { name: intro, label: "Intro (blank line = new paragraph, *stars* = cyan)", type: text }
      - name: introHighlight
        label: Highlight line (shown in cyan under the intro, above “View work”)
        description: "One short sentence. Leave empty to hide it."
        type: string
      - { name: tagline, label: Footer tagline, type: text }
      - { name: cv, label: CV (PDF), type: file }
      - { name: shareImage, label: "Link preview image (shown when you share the site on LinkedIn/WhatsApp — 1200×630)", type: image }
      - { name: email, label: Email, type: string }
      - { name: phone, label: Phone, type: string }
      - { name: whatsapp, label: "WhatsApp number (digits with country code, e.g. 919591770958)", type: string }
      - name: formKey
        label: Contact form key (from web3forms.com — see README)
        type: string
      - name: socials
        label: Social links
        type: object
        list:
          collapsible:
            summary: "{label}"
        fields:
          - { name: label, label: Label, type: string }
          - { name: url, label: URL, type: string }
      - name: stats
        label: Stats (Home & About)
        type: object
        list:
          collapsible:
            summary: "{value} {label}"
        fields:
          - { name: value, label: Value, type: string }
          - { name: label, label: Label, type: string }
      - name: highlights
        label: “What I do” cards
        type: object
        list:
          collapsible:
            summary: "{title}"
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - { name: image, label: "Image (optional, 16:10)", type: image }
          - { name: tools, label: Tools, type: string, list: true }

  # ---------------------------------------------------------------- About
  - name: about
    label: About page
    type: file
    path: src/data/about.json
    format: json
    fields:
      - { name: title, label: "Title (*stars* = neon)", type: string }
      - { name: intro, label: Intro, type: text }
      - { name: photo, label: "Photo of you (optional, shown under the intro)", type: image }
      - { name: photoCaption, label: Photo caption, type: string }
      - { name: quote, label: Philosophy quote, type: text }
      - { name: principles, label: Principles, type: string, list: true }
      - name: timeline
        label: Professional evolution
        type: object
        list:
          collapsible:
            summary: "{phase} · {title}"
        fields:
          - { name: phase, label: Phase number, type: string }
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - { name: tags, label: Tags, type: string, list: true }
          - { name: image, label: "Image (optional)", type: image }
      - name: why
        label: Why VFX makes better UX
        type: object
        list:
          collapsible:
            summary: "{title}"
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }

  # ---------------------------------------------------------------- Skills
  - name: skills
    label: Skills page
    type: file
    path: src/data/skills.json
    format: json
    fields:
      - { name: title, label: "Title (*stars* = neon)", type: string }
      - { name: intro, label: Intro, type: text }
      - name: groups
        label: Skill groups
        type: object
        list:
          collapsible:
            summary: "{name}"
        fields:
          - { name: name, label: Group name (also the filter button), type: string }
          - { name: note, label: Note, type: string }
          - name: items
            label: Skills
            type: object
            list:
              collapsible:
                summary: "{name} — {level}%"
            fields:
              - { name: name, label: Name, type: string }
              - { name: category, label: Category, type: string }
              - { name: level, label: Level (0–100), type: number }
              - { name: text, label: Description, type: text }
              - { name: tags, label: Tags, type: string, list: true }
      - name: glance
        label: At a glance
        type: object
        list: true
        fields:
          - { name: value, label: Value, type: string }
          - { name: label, label: Label, type: string }

  # ---------------------------------------------------------------- Experience
  - name: experience
    label: Experience page
    type: file
    path: src/data/experience.json
    format: json
    fields:
      - { name: title, label: "Title (*stars* = neon)", type: string }
      - { name: intro, label: Intro, type: text }
      - name: roles
        label: Roles (newest first)
        type: object
        list:
          collapsible:
            summary: "{title} — {org}"
        fields:
          - { name: title, label: Job title, type: string }
          - { name: org, label: Company, type: string }
          - { name: logo, label: "Company logo (optional, square)", type: image }
          - { name: start, label: Start date, description: "Pick any day in the month — the site only shows month and year.", type: date }
          - { name: end, label: End date, type: date }
          - { name: current, label: "I still work here (shows “Present” instead of the end date)", type: boolean, default: false }
          - { name: location, label: Location, type: string }
          - { name: points, label: Bullet points, type: string, list: true }
          - { name: tags, label: Tools, type: string, list: true }
      - name: productions
        label: Hollywood productions
        type: object
        list:
          collapsible:
            summary: "{title} ({year})"
        fields:
          - { name: title, label: Film, type: string }
          - { name: year, label: Year, type: string }
          - { name: studio, label: Studio, type: string }

  # ---------------------------------------------------------------- Education
  - name: education
    label: Education page
    type: file
    path: src/data/education.json
    format: json
    fields:
      - { name: title, label: "Title (*stars* = neon)", type: string }
      - { name: intro, label: Intro, type: text }
      - name: items
        label: Entries (newest first)
        type: object
        list:
          collapsible:
            summary: "{title} — {org}"
        fields:
          - { name: title, label: Qualification, type: string }
          - { name: org, label: Institution, type: string }
          - { name: logo, label: "Institution logo (optional, square)", type: image }
          - { name: start, label: Start date, description: "Pick any day in the month — the site only shows month and year.", type: date }
          - { name: end, label: End date, type: date }
          - { name: current, label: "Still studying here (shows “Present” instead of the end date)", type: boolean, default: false }
          - { name: grade, label: Grade, type: string }
          - { name: text, label: Description, type: text }
          - { name: points, label: Highlights, type: string, list: true }

  # ---------------------------------------------------------------- Contact
  - name: contact
    label: Contact page
    type: file
    path: src/data/contact.json
    format: json
    fields:
      - { name: title, label: "Title (*stars* = neon)", type: string }
      - { name: intro, label: Intro, type: text }
      - { name: availability, label: Phone availability, type: string }
      - { name: projectTypes, label: Enquiry types (form options), type: string, list: true }
      - name: faq
        label: FAQ
        type: object
        list:
          collapsible:
            summary: "{q}"
        fields:
          - { name: q, label: Question, type: string }
          - { name: a, label: Answer, type: text }
